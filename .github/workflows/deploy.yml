name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, HW36 ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install psycopg2-binary

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U testuser; do
          sleep 1
        done

    - name: Debug environment
      run: |
        echo "=== Environment Variables ==="
        echo "CI=$CI"
        echo "DB_NAME=$DB_NAME"
        echo "DB_USER=$DB_USER"
        echo "DB_HOST=$DB_HOST"
        echo "DB_PORT=$DB_PORT"
        echo "DATABASE_URL=$DATABASE_URL"
        echo ""
        echo "=== Python Debug ==="
        python -c "
import os
print('CI in os.environ:', os.environ.get('CI'))
print('DB_NAME in os.environ:', os.environ.get('DB_NAME'))
print('DB_USER in os.environ:', os.environ.get('DB_USER'))
print('DB_HOST in os.environ:', os.environ.get('DB_HOST'))
"
        echo ""
        echo "=== Django Settings ==="
        python -c "
import os
os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
try:
    import django
    django.setup()
    from django.conf import settings
    print('DATABASES:', settings.DATABASES)
except Exception as e:
    print('Error loading Django settings:', e)
"

    - name: Run tests
      env:
        CI: true
        SECRET_KEY: django-insecure-test-key
        DEBUG: True
        DB_NAME: testdb
        DB_USER: testuser
        DB_PASSWORD: testpass
        DB_HOST: localhost
        DB_PORT: 5432
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        STRIPE_SECRET_KEY: ""
        STRIPE_PUBLIC_KEY: ""
      run: |
        python manage.py check
        python manage.py migrate --verbosity 2
        python manage.py test --verbosity 2

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh/
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H 158.160.236.174 >> ~/.ssh/known_hosts
    
    - name: Deploy to server
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy@158.160.236.174 << 'EOF'
          cd /home/deploy/webapps/myproject
          git pull origin ${{ github.ref_name }}
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate
          python manage.py collectstatic --noinput
          sudo supervisorctl restart myproject
          sudo systemctl reload nginx
        EOF